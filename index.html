<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>江浙沪地区绿色酒店发展报告</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7abf18',
                        'primary-dark': '#5A9E16',
                        'primary-light': '#B5E673',
                        accent: '#16A085',
                        neutral: '#F0F8FF',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style>
        body {
            overflow: hidden; /* 防止滚动条影响粒子动画 */
            background-color: #7abf18; /* 主色作为背景 */
            position: relative;
            min-height: 100vh; /* 确保内容撑满屏幕 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Inter', sans-serif;
        }

        /* 粒子容器 */
        .particles-js {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0; /* 确保在内容下方 */
        }

        /* 汉堡菜单按钮样式 */
        .menu-toggle {
            position: absolute;
            top: 15px; /* 向下移动15px */
            right: 15px; /* 右上角定位 */
            z-index: 50; /* 确保在最顶层 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 24px;
            cursor: pointer;
            padding: 5px; /* 增加点击区域 */
        }
        .menu-toggle span {
            display: block;
            width: 100%;
            height: 3px;
            background-color: white;
            border-radius: 2px;
            transition: all 0.3s ease-in-out;
        }
        .menu-toggle.active #line1 {
            transform: translateY(10px) rotate(45deg);
        }
        .menu-toggle.active #line2 {
            opacity: 0;
        }
        .menu-toggle.active #line3 {
            transform: translateY(-10px) rotate(-45deg);
        }

        /* 侧边菜单样式 */
        .side-menu {
            position: fixed;
            top: 0;
            right: 0;
            width: 250px; /* 菜单宽度 */
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95); /* 半透明白色背景 */
            box-shadow: -5px 0 15px rgba(0,0,0,0.2);
            transform: translateX(100%); /* 初始隐藏在右侧 */
            transition: transform 0.3s ease-out;
            z-index: 40;
            padding-top: 80px; /* 为顶部导航预留空间 */
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-left: 20px;
        }
        .side-menu.open {
            transform: translateX(0); /* 展开菜单 */
        }
        .side-menu a {
            color: #333;
            padding: 10px 0;
            text-decoration: none;
            font-size: 1.1rem;
            width: 100%;
            border-bottom: 1px solid #eee;
        }
        .side-menu a:hover {
            color: #7abf18; /* 主色 */
        }

        /* 遮罩层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 30;
            display: none; /* 初始隐藏 */
        }
        .overlay.visible {
            display: block;
        }

        /* 开始阅读按钮样式 - 增加了呼吸动画 */
        .read-button {
            background-color: #16A085; /* 强调色 */
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 9999px; /* fully rounded */
            font-size: 1.25rem; /* text-xl */
            font-weight: bold;
            text-decoration: none;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 0 15px rgba(22, 160, 133, 0.5); /* 初始阴影，使用强调色并透明 */
            position: relative;
            overflow: hidden;
            z-index: 10; /* 确保在粒子上方 */
            display: inline-block; /* 确保动画和定位正确 */

            /* 呼吸动画 */
            animation: pulse-shadow 2s infinite ease-in-out; /* 2秒一个周期，无限循环，缓入缓出 */
        }

        /* 定义呼吸动画的关键帧 */
        @keyframes pulse-shadow {
            0% {
                box-shadow: 0 0 15px rgba(22, 160, 133, 0.5); /* 初始状态，强调色半透明阴影 */
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 30px rgba(22, 160, 133, 1), /* 阴影变大变亮 */
                            0 0 50px rgba(22, 160, 133, 0.7); /* 添加第二层更亮的阴影 */
                transform: scale(1.03); /* 稍微放大 */
            }
            100% {
                box-shadow: 0 0 15px rgba(22, 160, 133, 0.5); /* 回到初始状态 */
                transform: scale(1);
            }
        }

        .read-button:hover {
            background-color: #1abc9c; /* 更亮的强调色 */
            transform: translateY(-3px) scale(1.02); /* 悬停时也有微小的浮动和放大 */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); /* 更大的阴影 */
            animation: none; /* 悬停时停止呼吸动画 */
        }

        /* 按钮点击效果 (呼级灯样式) - 保持不变 */
        .read-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.4); /* 白色半透明 */
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.4s ease-out, height 0.4s ease-out, opacity 0.4s ease-out;
            opacity: 0;
            z-index: -1;
        }

        .read-button:active::before {
            width: 200%;
            height: 200%;
            opacity: 1;
            transition: width 0s, height 0s, opacity 0s; /* 瞬间展开 */
        }
        .read-button:active {
            transform: translateY(0px); /* 按下时恢复 */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2); /* 按下时阴影变小 */
            animation: none; /* 按下时停止呼吸动画 */
        }

        /* 主题标题样式 */
        .main-title {
            font-size: 2.5rem; /* 移动端标题大小 */
            line-height: 1.2;
            text-align: center;
            font-weight: bold;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3); /* 增加文字阴影 */
            z-index: 10;
        }

        @media (min-width: 768px) { /* 桌面端标题大小 */
            .main-title {
                font-size: 4rem;
            }
        }
        
        /* 粒子动画 Canvas 容器 */
        #particles-js-canvas-el {
            display: block; /* 确保 canvas 不会因为行内元素特性有底部空隙 */
            vertical-align: bottom; /* 移除可能的 canvas 底部空隙 */
        }
    </style>
</head>
<body>
    <div id="particles-js" class="particles-js"></div>

    <button id="menu-toggle" class="menu-toggle">
        <span id="line1"></span>
        <span id="line2"></span>
        <span id="line3"></span>
    </button>

    <div id="side-menu" class="side-menu">
        <a href="index.html" class="text-primary font-semibold">首页</a>
        <a href="chapter1.html">第一章</a>
        <a href="chapter2.html">第二章</a>
        <a href="chapter3.html">第三章</a>
        <a href="chapter4.html">第四章</a>
        <a href="chapter5.html">第五章</a>
        <a href="chapter6.html">第六章</a>
        <a href="chapter7.html">第七章</a>
        <a href="chapter8.html">关于我们</a>
    </div>

    <div id="overlay" class="overlay"></div>

    <div class="relative z-10 flex flex-col items-center justify-center min-h-screen p-4">
        <h1 class="main-title">江浙沪地区绿色酒店发展现状与趋势深度分析报告</h1>
        <a href="chapter1.html" class="read-button">开始阅读</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    
    <script>
        // 汉堡菜单逻辑
        const menuToggle = document.getElementById('menu-toggle');
        const sideMenu = document.getElementById('side-menu');
        const overlay = document.getElementById('overlay');

        function toggleMenu() {
            sideMenu.classList.toggle('open');
            overlay.classList.toggle('visible');
            menuToggle.classList.toggle('active');
        }

        menuToggle.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu); // 点击遮罩层关闭菜单

        // Particles.js 配置
        particlesJS('particles-js', {
            "particles": {
                "number": {
                    "value": 80, // 粒子数量
                    "density": {
                        "enable": true,
                        "value_area": 800 // 粒子密度
                    }
                },
                "color": {
                    "value": ["#16A085", "#F0F8FF"] // 强调色和中性色作为粒子颜色
                },
                "shape": {
                    "type": "circle",
                    "stroke": {
                        "width": 0,
                        "color": "#b6b2b2"
                    },
                    "polygon": {
                        "nb_sides": 5
                    }
                },
                "opacity": {
                    "value": 0.5,
                    "random": false,
                    "anim": {
                        "enable": false,
                        "speed": 1,
                        "opacity_min": 0.1,
                        "sync": false
                    }
                },
                "size": {
                    "value": 3, // 粒子大小
                    "random": true,
                    "anim": {
                        "enable": false,
                        "speed": 40,
                        "size_min": 0.1,
                        "sync": false
                    }
                },
                "line_linked": {
                    "enable": true,
                    "distance": 150, // 粒子连线距离
                    "color": "#F0F8FF", // 中性色作为连线颜色
                    "opacity": 0.4,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 3, // 粒子移动速度
                    "direction": "none",
                    "random": false,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false,
                    "attract": {
                        "enable": false,
                        "rotateX": 600,
                        "rotateY": 1200
                    }
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": {
                        "enable": true,
                        "mode": "grab" // 鼠标悬停模式 (抓取)
                    },
                    "onclick": {
                        "enable": true,
                        "mode": "push" // 鼠标点击模式 (增加粒子)
                    },
                    "resize": true
                },
                "modes": {
                    "grab": {
                        "distance": 140,
                        "line_linked": {
                            "opacity": 1
                        }
                    },
                    "bubble": {
                        "distance": 400,
                        "size": 40,
                        "duration": 2,
                        "opacity": 8,
                        "speed": 3
                    },
                    "repulse": {
                        "distance": 200,
                        "duration": 0.4
                    },
                    "push": {
                        "particles_nb": 4
                    },
                    "remove": {
                        "particles_nb": 2
                    }
                }
            },
            "retina_detect": true
        });
    </script>
</body>
</html>
